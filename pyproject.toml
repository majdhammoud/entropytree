[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "entropytree"
version = "0.1.0"
description = "Decision tree classifier from scratch (entropy / information gain) for pandas DataFrames"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
